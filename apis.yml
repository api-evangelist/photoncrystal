name: Photon Crystal Energy
description: Photon Crystal Energy Technology Ltd. (广东光晶能源科技有限公司) is a China-based
  perovskite photovoltaic module manufacturer, founded May 2022 and headquartered in
  Foshan, Guangdong. The company commercializes full wet-process, full-printed perovskite
  PV modules for building-integrated photovoltaics (BIPV), photovoltaic curtain walls,
  rooftop distributed solar, carports and architectural solar applications. Product
  families include standard, semi-transparent, textured, architectural color and solar
  tile modules, and the firm operates a 100 MW full-printed perovskite pilot line with
  IEC 61215 / IEC 61730 certification milestones. Surfaced as a portfolio company of
  Qiming and added to the API Evangelist network; it publishes a marketing/corporate
  website but no public API, SDK, or developer surface.
